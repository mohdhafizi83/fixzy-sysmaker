# electron-builder config (Phase 6.3) — unsigned first.
# Codesign/notarize: optional, needs Apple Developer account (owner decision).
# Build: npx electron-builder --win --mac (see README)

appId: com.fixzy.app
productName: Fixzy SysMaker
copyright: Copyright © 2026 Hafizi

directories:
  output: dist
  buildResources: build

files:
  - src/**/*
  - resources/schema.sql
  - package.json
  # Renderer static assets (index.html references ../assets/ from src/).
  # Without these the packaged app shows broken favicon/icons (verified: v1.0.1
  # asar shipped with zero assets entries). Minimum set only — full fontawesome
  # tree is 44MB; we ship css/all.min.css + woff2 fonts (~800KB).
  - assets/favicon.ico
  - assets/favicon.png
  - assets/fontawesome/css/all.min.css
  - assets/fontawesome/webfonts/*.woff2
  - assets/fontawesome/LICENSE.txt
  # preview_env is NOT bundled (download-on-first-run): the setup wizard fetches
  # the template from GitHub releases into ~/.fixzy/preview_env (see setupRunner.js).
  - "!**/*.bak*"

asarUnpack:
  - bin/composer.phar

# PHP is NOT bundled — provisioned per-platform via `npm run setup:binaries`
# or resolved from PATH / FSM_PHP_BIN (see src/core/phpResolver.js).

win:
  target:
    - target: nsis
      arch: [x64]
  icon: build/icon.ico

mac:
  target:
    - target: dmg
      arch: [x64, arm64]
  category: public.app-category.developer-tools
  icon: build/icon.icns
  # identity: null  # unsigned; set to sign when owner has a Developer ID

linux:
  target:
    - target: AppImage
      arch: [x64]
    - target: deb
      arch: [x64]
  icon: build/icon.png
  category: Development
  maintainer: "Mohd Hafizi Mohammad Nor <mohdhafizi83@gmail.com>"
  synopsis: "Visual database designer that generates Laravel + Filament admin systems"
  description: "Design your database visually or import an existing SQL dump and get a complete Laravel + Filament admin system: migrations, models, resources, dashboards and deployment docs. Includes a headless CLI and an MCP server for AI agents."
  desktop:
    entry:
      Name: Fixzy SysMaker
      Comment: "Visual database designer for Laravel + Filament"
      Categories: "Development;IDE;"

nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
